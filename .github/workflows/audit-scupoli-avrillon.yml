name: Audit Pusey Scupoli and Avrillon signed prefaces
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-scupoli-avrillon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-prefaces:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect title pages, preface headings and signed dates
        run: python tools/audit_scupoli_avrillon_prefaces.py
      - name: Save auditable section boundaries, without importing translations
        run: |
          git config user.name "Pusey Corpus Preface Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/scupoli_avrillon_preface_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Scupoli and Avrillon source OCR and Pusey preface boundaries"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 2
            done
          fi
