name: Audit next four Pusey bibliography source boundaries
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-next-prefaces.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-source-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect source title pages, Pusey signatures and passage boundaries
        run: python tools/audit_next_pusey_prefaces.py
      - name: Commit reviewable passage evidence
        run: |
          git config user.name "Pusey Corpus Preface Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/multi_preface_source_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit Pusey authored sections in Purchas, Augustine, Justin and Cyril"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin main; then break; fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 2
            done
          fi
