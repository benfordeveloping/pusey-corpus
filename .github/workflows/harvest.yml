# One-time final source import. Internet Archive harvesting/search job retired.
name: Finalize Cyril preface (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harvest.yml'
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transcription parser
        run: python -m pip install requests beautifulsoup4
      - name: Verify and extract the E. B. Pusey portion of the 1874 Cyril preface
        run: python tools/finalize_cyril.py
      - name: Commit finished corpus record and dispatch final site publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Pusey Corpus Finisher"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean data/records data/source_registry.csv data/harvest_report.csv
          git diff --cached --quiet && { echo "Nothing changed"; exit 1; }
          git commit -m "Publish verified E. B. Pusey portion of Cyril on John preface"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run publish.yml --ref main
