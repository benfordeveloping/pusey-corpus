name: Import Hampden and inspect Anselm Historical Notice
on:
  push:
    branches: [main]
    paths:
      - 'tools/import_hampden_audit_anselm_20261114.py'
      - '.github/workflows/import-hampden-audit-anselm.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-hampden-audit-anselm
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: python -m pip install -r requirements.txt
      - name: Import Hampden, audit Anselm Pusey-only excerpt boundaries
        run: python tools/import_hampden_audit_anselm_20261114.py
      - name: Commit verified Hampden and Anselm scope audit
        run: |
          git config user.name "pusey-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/clean/ data/records/ data/source_registry.csv data/harvest_report.csv data/anselm_historical_notice_audit_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "Import verified Hampden OCR and audit Anselm Historical Notice boundaries"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new source text or audit results."
          fi
