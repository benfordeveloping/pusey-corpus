name: Audit Nouet volume III Pusey-signed Advertisement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-nouet-advertisement.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-nouet-introduction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Locate Advertisement and E.B.P. signature without importing Nouet's text
        run: python tools/audit_nouet_vol3_advertisement.py
      - name: Commit exact OCR boundary evidence
        run: |
          git config user.name "Pusey Corpus Bibliography Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/nouet_vol3_advertisement_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit Nouet III Pusey-signed Advertisement boundary"
            git pull --rebase origin main
            git push origin main
          fi
