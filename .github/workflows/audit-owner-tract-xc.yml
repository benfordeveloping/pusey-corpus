name: Audit Pusey's Historical Preface to Tract XC
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_owner_tract_xc_20261114.py'
      - '.github/workflows/audit-owner-tract-xc.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inspect 1865 text and Pusey-only boundaries
        run: python tools/audit_owner_tract_xc_20261114.py
      - name: Commit scholarly boundary audit
        run: |
          git config user.name "pusey-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tract_xc_historical_preface_audit_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit Pusey Historical Preface to Tract XC against full multi-author OCR"
            git pull --rebase origin main
            git push origin main
          fi
