name: Validate user-supplied Parochial Sermons volume III
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-parochial-volume3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify user-supplied OCR title page and metadata
        run: python tools/audit_parochial_vol3.py
      - name: Commit source audit evidence
        run: |
          git config user.name "Pusey Corpus Bibliography Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/parochial_vol3_source_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Parochial Sermons III volume and edition audit"
            git pull --rebase origin main
            git push origin main
          fi
