name: Gather complete Liddon biography
on:
  push:
    branches: [main]
    paths:
      - liddon_library.py
      - .github/workflows/harvest-liddon.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liddon-harvest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full corpus repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parsing dependency
        run: python -m pip install beautifulsoup4
      - name: Gather and validate every linked source chapter
        run: python liddon_library.py fetch
      - name: Commit 69 transcribed chapters to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/liddon/
          if git diff --cached --quiet; then
            echo "All 69 chapters are unchanged."
          else
            git commit -m "Import all 69 Liddon biography chapters from Project Canterbury"
            git push
          fi
