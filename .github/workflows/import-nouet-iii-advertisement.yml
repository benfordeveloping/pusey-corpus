name: Extract Pusey signed Nouet III Advertisement only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-nouet-iii-advertisement.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: import-nouet-iii
  cancel-in-progress: false
jobs:
  signed-introduction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Extract only Pusey's 1846 signed Advertisement
        run: python tools/import_nouet_vol3_advertisement.py
      - name: Commit text with explicit excerpt boundaries and provenance
        run: |
          git config user.name "Pusey Corpus Excerpt Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean data/records data/source_registry.csv data/harvest_report.csv
          if ! git diff --cached --quiet; then
            git commit -m "Index E.B.P.-signed Nouet III Advertisement without translation"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin main; then
                echo "Verified excerpt pushed successfully."
                break
              fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Rebuild public search using only authorized Pusey prose
        run: |
          python build.py
          npx -y pagefind@1.4.0 --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy updated corpus
        id: deployment
        uses: actions/deploy-pages@v4
