name: Audit Pusey Confessions preface section boundaries
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-augustine-preface.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-augustine-preface:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Examine title and preface boundaries but never import Augustine
        run: python tools/audit_augustine_preface.py
      - name: Save bounded extraction evidence
        run: |
          git config user.name "Pusey Corpus Augustine Preface Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/augustine_preface_boundaries.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit Pusey's Confessions preface OCR section boundaries"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin main; then break; fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 2
            done
          fi
