name: Build and publish Pusey Corpus
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Harvest OCR from Internet Archive"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test category-or-single-work filter
        run: python tools/test_search_scope.py
      - name: Build static readings and independent search indexes
        run: |
          python build.py
          python tools/test_sermon_search.py
          # Keep corpus-volume and individual-sermon results in separate indexes.
          npx -y pagefind@1.4.0 --site site --glob 'works/**/*.html'
          npx -y pagefind@1.4.0 --site site --glob 'sermons/m???.html' --output-subdir sermons/pagefind
          test -f site/pagefind/pagefind.js
          test -f site/sermons/pagefind/pagefind.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
