name: Verify OCR and expand Pusey public concordance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-initial-sources.yml'
      - 'tools/verify_initial_sources.py'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: initial-source-verification
  cancel-in-progress: false
jobs:
  verify-harvest-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect archive metadata and real OCR for 29 precisely matched works
        run: python tools/verify_initial_sources.py
      - name: Commit verified OCR, manifests, and audit trail
        run: |
          git config user.name "Pusey Corpus Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean data/records data/source_registry.csv data/harvest_report.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add verified OCR texts to the Pusey concordance"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin main; then
                echo "Verified OCR committed."
                break
              fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 2
            done
          else
            echo "No new OCR texts passed verification."
          fi
      - name: Build complete site and search index
        run: |
          python build.py
          npx -y pagefind@1.4.0 --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy updated searchable corpus
        id: deployment
        uses: actions/deploy-pages@v4
