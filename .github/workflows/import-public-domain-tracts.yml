name: Import Pusey fasting tracts from Wikisource
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-public-domain-tracts.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: import-public-domain-tracts
  cancel-in-progress: false
jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "beautifulsoup4>=4.12,<5"
      - name: Extract and quality-check complete fasting tract transcriptions
        run: python tools/import_wikisource_tracts.py
      - name: Commit public-domain texts with provenance
        run: |
          git config user.name "Pusey Corpus Text Importer"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean data/records data/source_registry.csv data/harvest_report.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add Pusey fasting tracts with Wikisource provenance"
            git pull --rebase origin main
            git push origin main
          else
            echo "No additional tracts imported."
          fi
      - name: Regenerate corpus and Pagefind index
        run: |
          python build.py
          npx -y pagefind@1.4.0 --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy expanded searchable corpus
        id: deployment
        uses: actions/deploy-pages@v4
