name: Audit Tertullian Pusey preface and all editorial endnotes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-tertullian-editorial.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit every lettered Note and signed editorial preface
        run: python tools/audit_tertullian_editorial.py
      - name: Save edition evidence without indexing Tertullian's translation
        run: |
          git config user.name "Pusey Corpus Editorial Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/tertullian_editorial_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Tertullian V10 editorial note OCR boundaries"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 2
            done
          fi
