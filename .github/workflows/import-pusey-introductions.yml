name: Import separately published Pusey introductions only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-pusey-introductions.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: import-pusey-introductions
  cancel-in-progress: false
jobs:
  verified-prefaces:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OCR dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify standalone Pusey introductory essay editions
        run: python tools/import_standalone_pusey_introductions.py
      - name: Commit verified prefaces, never books translated by Pusey
        run: |
          git config user.name "Pusey Corpus Preface Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean data/records data/source_registry.csv data/harvest_report.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add separately issued Pusey introductions only"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new Pusey introduction passed OCR checks."
          fi
      - name: Build site including only approved Pusey prose
        run: |
          python build.py
          npx -y pagefind@1.4.0 --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy expanded Pusey concordance
        id: deployment
        uses: actions/deploy-pages@v4
