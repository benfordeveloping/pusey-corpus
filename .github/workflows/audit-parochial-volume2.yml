name: Validate 1883 Parochial Sermons volume II
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-parochial-volume2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check source volume, imprint date, and expected sermons
        run: python tools/audit_parochial_vol2.py
      - name: Save auditable evidence before text ingestion
        run: |
          git config user.name "Pusey Corpus Bibliography Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/parochial_vol2_source_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Parochial Sermons II edition and contents evidence"
            git pull --rebase origin main
            git push origin main
          fi
