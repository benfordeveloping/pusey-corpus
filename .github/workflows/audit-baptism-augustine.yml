name: Audit Baptism editions and Augustine preface
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-baptism-augustine.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-owner-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR metadata requirements
        run: python -m pip install -r requirements.txt
      - name: Check 1836 and 1840 baptism editions and Augustine introduction
        run: python tools/audit_owner_baptism_augustine.py
      - name: Commit source title page and excerpt evidence
        run: |
          git config user.name "Pusey Corpus Bibliography Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/owner_source_audit_20261113.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit owner-provided original and enlarged baptism scans and Augustine preface"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin main; then break; fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 2
            done
          fi
