name: Audit missing University I and II sermon boundaries
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_us1_us2_sermon_links.py'
      - '.github/workflows/audit-us1-us2-sermon-links.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect sermon library and source texts
        run: python tools/audit_us1_us2_sermon_links.py
      - name: Save boundary report
        run: |
          git config user.name "pusey-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sermons/owner_us1_us2_boundary_audit_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit missing US1 and US2 sermon text and preface boundaries"
            git pull --rebase origin main
            git push origin main
          fi
