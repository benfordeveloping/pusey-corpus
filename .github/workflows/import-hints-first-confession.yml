name: Import Pusey's Hints for a First Confession
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-hints-first-confession.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: import-hints-first-confession
  cancel-in-progress: false
jobs:
  import-signed-work:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project HTML and OCR dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "beautifulsoup4>=4.12,<5"
      - name: Extract exactly the Pusey-authored text
        run: python tools/import_hints_first_confession.py
      - name: Commit source, text, and verification record
        run: |
          git config user.name "Pusey Corpus Public-Domain Importer"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean data/records data/source_registry.csv data/harvest_report.csv
          if ! git diff --cached --quiet; then
            git commit -m "Index Hints for a First Confession (1851) from verified 1884 reprint"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin main; then break; fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Rebuild full-text search index
        run: |
          python build.py
          npx -y pagefind@1.4.0 --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy updated Pusey corpus
        id: deployment
        uses: actions/deploy-pages@v4
