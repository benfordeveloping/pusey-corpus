name: Resolve US1 pamphlets and US2 OCR-boundary variants
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_sermon_extra.py'
      - '.github/workflows/audit-sermon-extra.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/audit_sermon_extra.py
      - run: |
          git config user.name "pusey-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sermons/owner_sermon_additional_boundaries_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "Check exact source pamphlet and sermon boundaries"
            git pull --rebase origin main
            git push origin main
          fi
