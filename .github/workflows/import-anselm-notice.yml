name: Import Pusey's Anselm Historical Notice and compare marriage OCR
on:
  push:
    branches: [main]
    paths:
      - 'tools/import_anselm_notice_audit_marriage_20261114.py'
      - '.github/workflows/import-anselm-notice.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-anselm-notice
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: python -m pip install -r requirements.txt
      - name: Strictly extract signed 1856 Historical Notice, compare alternative marriage OCR
        run: python tools/import_anselm_notice_audit_marriage_20261114.py
      - name: Commit Pusey-only excerpt, corrected metadata, and OCR comparison
        run: |
          git config user.name "pusey-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography.json data/raw/ data/clean/ data/records/ data/source_registry.csv data/harvest_report.csv data/owner_source_ledger_20261113.json data/marriage_ocr_alternative_audit_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "Index Pusey's signed Anselm Historical Notice only; audit marriage variant"
            git pull --rebase origin main
            git push origin main
          else
            echo "No additions to import."
          fi
