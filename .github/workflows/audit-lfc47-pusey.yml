name: Audit LFC 47 E B Pusey continuation
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit_lfc47_pusey_1881.py'
      - '.github/workflows/audit-lfc47-pusey.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Audit signed Pusey portion and joint-authorship boundary
        run: python tools/audit_lfc47_pusey_1881.py
      - name: Save traceable OCR findings
        run: |
          git config user.name "pusey-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lfc47_cyril_pusey_authorship_audit_20261114.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit 1881 Cyril five tomes preface E B Pusey contribution"
            git pull --rebase origin main
            git push origin main
          fi
