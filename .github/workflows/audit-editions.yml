name: Audit Pusey editions and request yes-no identification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-editions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-editions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect competing volume and edition metadata and OCR front matter
        run: python tools/audit_competing_editions.py
      - name: Commit source audit for owner review
        run: |
          git config user.name "Pusey Corpus Edition Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/edition_audit.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save source edition and title-page audit"
            git pull --rebase origin main
            git push origin main
          else
            echo "No edition audit changes."
          fi
