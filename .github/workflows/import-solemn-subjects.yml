name: Import Pusey sermons I and XI through XIX from Leeds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-solemn-subjects.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: import-pusey-leeds
  cancel-in-progress: false
jobs:
  authorship-limited-import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Download ten distinct sermons and verify Pusey-only authorship
        run: python tools/import_solemn_subjects_pusey.py
      - name: Commit source-indexed sermons with edition metadata
        run: |
          git config user.name "Pusey Corpus Sermon Harvester"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean data/records data/source_registry.csv data/harvest_report.csv
          if ! git diff --cached --quiet; then
            git commit -m "Import Pusey-only sermons I, XI–XIX from Leeds 1845"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin main; then break; fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Build and index all confirmed Pusey works
        run: |
          python build.py
          npx -y pagefind@1.4.0 --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy public corpus
        id: deployment
        uses: actions/deploy-pages@v4
