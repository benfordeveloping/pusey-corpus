name: Import Pusey's Tract XC Historical Preface only
on:
  push:
    branches: [main]
    paths:
      - 'tools/import_owner_tract_xc_20261114.py'
      - '.github/workflows/import-owner-tract-xc.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/import_owner_tract_xc_20261114.py
      - name: Commit verified Pusey-only OCR
        run: |
          git config user.name "pusey-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography.json data/raw data/clean data/records data/source_registry.csv data/harvest_report.csv data/owner_source_ledger_20261113.json
          if ! git diff --cached --quiet; then
            git commit -m "Index Pusey 1865 Tract XC preface and 1866 postscript, excluding Newman"
            git pull --rebase origin main
            git push origin main
          fi
