name: Import Pusey's 1838 Augustine Confessions preface only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-augustine-preface.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: import-augustine-preface
  cancel-in-progress: false
jobs:
  import-authored-preface:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Pusey’s 1838 signature and isolate preface from Augustine
        run: python tools/import_augustine_preface.py
      - name: Commit signed Pusey excerpt and edition metadata
        run: |
          git config user.name "Pusey Corpus Augustine Preface Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/clean data/records data/source_registry.csv data/harvest_report.csv
          if ! git diff --cached --quiet; then
            git commit -m "Index only Pusey's 1838 Confessions preface from 1887 reprint"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin main; then break; fi
              if [ "$attempt" = 6 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Generate source-linked public full-text search
        run: |
          python build.py
          npx -y pagefind@1.4.0 --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy full corpus
        id: deployment
        uses: actions/deploy-pages@v4
